name: Full proof

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [main, alpha, beta]

permissions:
  contents: read

concurrency:
  group: full-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proof:
    if: contains(github.event.pull_request.labels.*.name, 'full-proof')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 make g++

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare built CLI fixtures
        run: bun run build

      - name: Run complete proof
        run: bun run proof
